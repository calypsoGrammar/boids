# Pull request checks. This workflow only reads the repository: it has no
# write permissions, uses no secrets and never deploys or publishes.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported release (package.json engines), the active
        # LTS, and the release the Archon runner uses.
        node: ['22.13', '24', '26']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      # The build must reproduce the committed dist/ exactly (npm test also
      # checks the asset file names).
      - run: git diff --exit-code -- dist
      - run: npm test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm audit --audit-level=high
